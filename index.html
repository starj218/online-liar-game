<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>온라인 라이어 게임</title>


<style>

/* =====================================================
   기본
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {

    background:
        radial-gradient(
            circle at top,
            #282828,
            #151515 70%
        );

    color: white;

    font-family:
        Arial,
        "Malgun Gothic",
        sans-serif;

    overflow-x: hidden;
}


button,
input {

    font-family: inherit;

}


button {

    border: none;
    cursor: pointer;

}


.hidden {

    display: none !important;

}


/* =====================================================
   공통 화면
===================================================== */

.screen {

    min-height: 100vh;

    position: relative;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 30px 20px;

    overflow: hidden;

}


/* =====================================================
   배경 장식
===================================================== */

.shape {

    position: absolute;

    opacity: 0.95;

    animation:
        floating
        5s
        ease-in-out
        infinite
        alternate;

}


.shape1 {

    width: 110px;
    height: 70px;

    background: #dc9df1;

    border-radius:
        60% 40% 45% 55%;

    top: 6%;
    left: 3%;

    transform: rotate(15deg);

}


.shape2 {

    width: 68px;
    height: 68px;

    background: #ff7627;

    border-radius:
        48% 52% 60% 40%;

    top: 9%;
    left: 47%;

}


.shape3 {

    width: 65px;
    height: 95px;

    background: #50d9e6;

    border-radius:
        65% 35% 45% 55%;

    top: 17%;
    right: 4%;

}


.shape4 {

    width: 65px;
    height: 145px;

    background: #14c56d;

    border-radius:
        50px;

    left: 10%;
    bottom: 7%;

    transform:
        rotate(30deg);

}


.shape5 {

    width: 55px;
    height: 92px;

    background: #f44eb8;

    border-radius:
        50% 50% 60% 40%;

    right: 24%;
    bottom: 10%;

    transform:
        rotate(-25deg);

}


@keyframes floating {

    from {

        translate:
            0 0;

    }

    to {

        translate:
            0 -15px;

    }

}


/* =====================================================
   닉네임
===================================================== */

.nickname-card {

    width:
        min(
            92vw,
            460px
        );

    padding:
        42px 35px;

    background:
        #f5f5f5;

    border:
        7px solid
        #cbbbea;

    border-radius:
        42px;

    color:
        #171717;

    text-align:
        center;

    box-shadow:
        0 25px 70px
        rgba(
            0,
            0,
            0,
            0.4
        );

}


.nickname-title {

    font-size:
        clamp(
            30px,
            8vw,
            44px
        );

    font-weight:
        900;

    margin-bottom:
        28px;

}


.text-input {

    width:
        100%;

    padding:
        16px 18px;

    border:
        3px solid
        #222;

    border-radius:
        17px;

    outline:
        none;

    font-size:
        19px;

    text-align:
        center;

    background:
        white;

}


.primary-button {

    width:
        100%;

    padding:
        15px 20px;

    margin-top:
        15px;

    border-radius:
        16px;

    background:
        #5965ef;

    color:
        white;

    font-size:
        20px;

    font-weight:
        800;

    transition:
        0.18s;

}


.primary-button:hover {

    transform:
        translateY(-2px)
        scale(1.01);

}


.error-text {

    min-height:
        24px;

    margin-top:
        14px;

    color:
        #dc2626;

    font-weight:
        700;

}


/* =====================================================
   메인 화면
===================================================== */

.main-content {

    position:
        relative;

    z-index:
        5;

    width:
        min(
            92vw,
            560px
        );

    text-align:
        center;

}


.logo {

    margin-bottom:
        80px;

    font-size:
        clamp(
            45px,
            10vw,
            72px
        );

    font-weight:
        1000;

    letter-spacing:
        -5px;

    transform:
        rotate(-3deg);

    text-shadow:
        5px 5px 0
        rgba(
            0,
            0,
            0,
            0.3
        );

}


.menu-button {

    display:
        block;

    width:
        min(
            280px,
            80vw
        );

    margin:
        14px auto;

    padding:
        17px 20px;

    border-radius:
        25px;

    color:
        white;

    font-size:
        23px;

    font-weight:
        900;

    transition:
        0.18s;

    box-shadow:
        0 8px 25px
        rgba(
            0,
            0,
            0,
            0.25
        );

}


.menu-button:hover {

    transform:
        translateY(-3px)
        scale(1.035);

}


.room-button {

    background:
        #5965ef;

}


.match-button {

    background:
        #13b96a;

}


/* =====================================================
   팝업
===================================================== */

.modal-backdrop {

    position:
        fixed;

    inset:
        0;

    z-index:
        200;

    background:
        rgba(
            0,
            0,
            0,
            0.7
        );

    backdrop-filter:
        blur(8px);

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    padding:
        20px;

}


.modal {

    width:
        min(
            92vw,
            450px
        );

    background:
        #252525;

    border:
        2px solid
        #444;

    border-radius:
        28px;

    padding:
        30px;

    text-align:
        center;

    box-shadow:
        0 25px 80px
        rgba(
            0,
            0,
            0,
            0.5
        );

}


.modal-title {

    margin:
        0 0 22px;

    font-size:
        29px;

    font-weight:
        900;

}


.modal-description {

    color:
        #bdbdbd;

    line-height:
        1.6;

    margin-bottom:
        20px;

}


.modal-buttons {

    display:
        flex;

    gap:
        10px;

    margin-top:
        15px;

}


.modal-buttons button {

    flex:
        1;

}


/* =====================================================
   인원 선택
===================================================== */

.size-grid {

    display:
        grid;

    grid-template-columns:
        repeat(
            5,
            1fr
        );

    gap:
        8px;

}


.size-button {

    padding:
        17px 5px;

    background:
        #373737;

    color:
        white;

    border-radius:
        14px;

    font-size:
        17px;

    font-weight:
        900;

    transition:
        0.15s;

}


.size-button:hover {

    background:
        #13b96a;

    transform:
        translateY(-2px);

}


/* =====================================================
   보조 버튼
===================================================== */

.secondary-button {

    padding:
        14px 20px;

    border-radius:
        14px;

    background:
        #4a4a4a;

    color:
        white;

    font-size:
        17px;

    font-weight:
        800;

}


.danger-button {

    padding:
        14px 20px;

    border-radius:
        14px;

    background:
        #c43b3b;

    color:
        white;

    font-size:
        17px;

    font-weight:
        800;

}


/* =====================================================
   대기방
===================================================== */

.waiting-card {

    position:
        relative;

    z-index:
        5;

    width:
        min(
            94vw,
            650px
        );

    padding:
        35px 30px;

    background:
        rgba(
            31,
            31,
            31,
            0.96
        );

    border:
        2px solid
        #404040;

    border-radius:
        30px;

    text-align:
        center;

    box-shadow:
        0 30px 90px
        rgba(
            0,
            0,
            0,
            0.4
        );

}


.waiting-title {

    font-size:
        clamp(
            29px,
            7vw,
            42px
        );

    font-weight:
        900;

    margin-bottom:
        10px;

}


.room-code {

    display:
        inline-block;

    margin:
        15px 0;

    padding:
        10px 20px;

    border-radius:
        12px;

    background:
        #111;

    color:
        #98a4ff;

    font-size:
        28px;

    font-weight:
        900;

    letter-spacing:
        3px;

}


.big-count {

    margin:
        25px 0;

    font-size:
        58px;

    font-weight:
        1000;

}


.waiting-player-grid {

    display:
        grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                130px,
                1fr
            )
        );

    gap:
        10px;

    margin:
        25px 0;

}


.waiting-player {

    padding:
        13px 10px;

    border-radius:
        14px;

    background:
        #333;

    font-weight:
        800;

}


.waiting-player.me {

    background:
        #4e58c8;

    border:
        2px solid
        #9ca5ff;

}


.start-button {

    width:
        min(
            320px,
            100%
        );

    padding:
        17px;

    border-radius:
        16px;

    font-size:
        20px;

    font-weight:
        900;

    background:
        #3f3f3f;

    color:
        #888;

    cursor:
        not-allowed;

}


.start-button.active {

    background:
        #16a34a;

    color:
        white;

    cursor:
        pointer;

    box-shadow:
        0 0 30px
        rgba(
            22,
            163,
            74,
            0.35
        );

}


.start-button.active:hover {

    transform:
        scale(1.025);

}


/* =====================================================
   우측 아래 플레이어 목록
===================================================== */

.player-list-box {

    position:
        fixed;

    z-index:
        150;

    right:
        16px;

    bottom:
        16px;

    width:
        205px;

    max-height:
        255px;

    overflow-y:
        auto;

    padding:
        14px;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            0.16
        );

    border-radius:
        17px;

    background:
        rgba(
            5,
            5,
            5,
            0.72
        );

    backdrop-filter:
        blur(10px);

    box-shadow:
        0 10px 35px
        rgba(
            0,
            0,
            0,
            0.3
        );

}


.player-list-title {

    font-size:
        14px;

    font-weight:
        900;

    margin-bottom:
        9px;

    color:
        #ddd;

}


.player-row {

    padding:
        5px 2px;

    font-size:
        14px;

    color:
        #ccc;

}


.player-row.me {

    color:
        #75e8f5;

    font-weight:
        900;

}


/* =====================================================
   토스트
===================================================== */

.toast {

    position:
        fixed;

    z-index:
        500;

    top:
        24px;

    left:
        50%;

    transform:
        translateX(-50%);

    padding:
        13px 22px;

    border-radius:
        14px;

    background:
        rgba(
            20,
            20,
            20,
            0.95
        );

    border:
        1px solid
        #555;

    font-weight:
        800;

    box-shadow:
        0 10px 40px
        rgba(
            0,
            0,
            0,
            0.4
        );

}


/* =====================================================
   다음 단계 placeholder
===================================================== */

.next-stage {

    width:
        min(
            92vw,
            600px
        );

    padding:
        45px 30px;

    border-radius:
        30px;

    background:
        #222;

    text-align:
        center;

    border:
        2px solid
        #444;

}


.next-stage h1 {

    font-size:
        38px;

}


/* =====================================================
   모바일
===================================================== */

@media (
    max-width: 650px
) {

    .player-list-box {

        width:
            160px;

        right:
            8px;

        bottom:
            8px;

        max-height:
            180px;

    }


    .logo {

        margin-bottom:
            60px;

    }


    .size-grid {

        grid-template-columns:
            repeat(
                3,
                1fr
            );

    }


    .waiting-card {

        padding-bottom:
            150px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     닉네임
===================================================== -->

<section
    id="nicknameScreen"
    class="screen"
>

    <div class="nickname-card">

        <div class="nickname-title">

            &lt;닉네임&gt;

        </div>


        <input
            id="nicknameInput"
            class="text-input"
            maxlength="10"
            autocomplete="off"
            placeholder="닉네임을 입력하세요"
        >


        <button
            class="primary-button"
            onclick="enterGame()"
        >

            입장

        </button>


        <div
            id="nicknameError"
            class="error-text"
        ></div>

    </div>

</section>



<!-- =====================================================
     메인
===================================================== -->

<section
    id="mainScreen"
    class="screen hidden"
>

    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>
    <div class="shape shape4"></div>
    <div class="shape shape5"></div>


    <div class="main-content">

        <div class="logo">

            라이어 게임

        </div>


        <button
            class="menu-button room-button"
            onclick="openRoomModal()"
        >

            방번호 입장

        </button>


        <button
            class="menu-button match-button"
            onclick="openMatchModal()"
        >

            랜덤 매칭

        </button>

    </div>

</section>



<!-- =====================================================
     대기방
===================================================== -->

<section
    id="waitingScreen"
    class="screen hidden"
>

    <div class="shape shape1"></div>
    <div class="shape shape3"></div>
    <div class="shape shape5"></div>


    <div class="waiting-card">

        <div
            id="waitingTitle"
            class="waiting-title"
        >

            대기 중

        </div>


        <div
            id="waitingSubtitle"
            class="modal-description"
        ></div>


        <div
            id="roomCodeDisplay"
            class="room-code hidden"
        ></div>


        <div
            id="bigCount"
            class="big-count"
        >

            0 / 4

        </div>


        <div
            id="waitingPlayerGrid"
            class="waiting-player-grid"
        ></div>


        <button
            id="startGameButton"
            class="start-button hidden"
            onclick="requestGameStart()"
        >

            게임 시작

        </button>


        <div>

            <button
                class="danger-button"
                style="margin-top: 18px;"
                onclick="leaveCurrentPlace()"
            >

                나가기

            </button>

        </div>

    </div>

</section>



<!-- =====================================================
     다음 단계 임시 화면
===================================================== -->

<section
    id="nextStageScreen"
    class="screen hidden"
>

    <div class="next-stage">

        <h1>

            🎉 인원 확정!

        </h1>


        <p>

            방과 매칭 시스템이 정상적으로 작동했습니다.

        </p>


        <p>

            다음 단계에서 여기부터

            <br><br>

            <b>
                기본형 / 질문형 / 바보형
            </b>

            <br><br>

            게임 방식 투표를 시작합니다.

        </p>

    </div>

</section>



<!-- =====================================================
     방 코드 팝업
===================================================== -->

<div
    id="roomModal"
    class="modal-backdrop hidden"
>

    <div class="modal">

        <div class="modal-title">

            방번호 입장

        </div>


        <div class="modal-description">

            같은 방 코드를 입력한 사람끼리
            같은 방에 들어갑니다.

        </div>


        <input
            id="roomCodeInput"
            class="text-input"
            maxlength="8"
            autocomplete="off"
            placeholder="예: LIAR7"
        >


        <div
            id="roomError"
            class="error-text"
        ></div>


        <div class="modal-buttons">

            <button
                class="secondary-button"
                onclick="closeRoomModal()"
            >

                취소

            </button>


            <button
                class="primary-button"
                style="margin-top: 0;"
                onclick="joinCodeRoom()"
            >

                입장

            </button>

        </div>

    </div>

</div>



<!-- =====================================================
     랜덤 매칭 팝업
===================================================== -->

<div
    id="matchModal"
    class="modal-backdrop hidden"
>

    <div class="modal">

        <div class="modal-title">

            랜덤 매칭

        </div>


        <div class="modal-description">

            원하는 플레이 인원수를 선택하세요.

        </div>


        <div class="size-grid">

            <button
                class="size-button"
                onclick="startMatchmaking(4)"
            >
                4인
            </button>

            <button
                class="size-button"
                onclick="startMatchmaking(5)"
            >
                5인
            </button>

            <button
                class="size-button"
                onclick="startMatchmaking(6)"
            >
                6인
            </button>

            <button
                class="size-button"
                onclick="startMatchmaking(7)"
            >
                7인
            </button>

            <button
                class="size-button"
                onclick="startMatchmaking(8)"
            >
                8인
            </button>

        </div>


        <button
            class="secondary-button"
            style="
                margin-top: 20px;
                width: 100%;
            "
            onclick="closeMatchModal()"
        >

            취소

        </button>

    </div>

</div>



<!-- =====================================================
     우측 아래 플레이어 목록
===================================================== -->

<div
    id="playerListBox"
    class="player-list-box hidden"
>

    <div
        id="playerListTitle"
        class="player-list-title"
    >

        👥 현재 접속자

    </div>


    <div id="playerList"></div>

</div>



<!-- =====================================================
     토스트
===================================================== -->

<div
    id="toast"
    class="toast hidden"
></div>



<script src="/socket.io/socket.io.js"></script>


<script>

// =====================================================
// Socket
// =====================================================

const socket =
    io();


// =====================================================
// 상태
// =====================================================

let myNickname =
    "";

let currentMode =
    "lobby";

let currentRoom =
    null;

let currentTargetSize =
    null;

let onlinePlayers =
    [];

let currentDisplayPlayers =
    [];


// =====================================================
// 화면 전환
// =====================================================

function showScreen(id) {

    const screens = [

        "nicknameScreen",
        "mainScreen",
        "waitingScreen",
        "nextStageScreen"

    ];


    screens.forEach(
        screenId => {

            document
                .getElementById(
                    screenId
                )
                .classList
                .add(
                    "hidden"
                );

        }
    );


    document
        .getElementById(
            id
        )
        .classList
        .remove(
            "hidden"
        );

}


// =====================================================
// 토스트
// =====================================================

let toastTimer = null;


function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.remove(
        "hidden"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.add(
                    "hidden"
                );

            },
            2500
        );

}


// =====================================================
// 닉네임 입장
// =====================================================

function enterGame() {

    const input =
        document.getElementById(
            "nicknameInput"
        );


    const nickname =
        input.value.trim();


    const error =
        document.getElementById(
            "nicknameError"
        );


    error.textContent =
        "";


    socket.emit(
        "joinWithNickname",
        nickname,
        response => {

            if (
                !response.success
            ) {

                error.textContent =
                    response.message;

                return;
            }


            myNickname =
                response.nickname;


            currentMode =
                "lobby";


            showScreen(
                "mainScreen"
            );


            document
                .getElementById(
                    "playerListBox"
                )
                .classList
                .remove(
                    "hidden"
                );


            renderSidePlayerList();

        }
    );

}


// Enter
document
    .getElementById(
        "nicknameInput"
    )
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                enterGame();

            }

        }
    );


// =====================================================
// 방 코드 팝업
// =====================================================

function openRoomModal() {

    document
        .getElementById(
            "roomModal"
        )
        .classList
        .remove(
            "hidden"
        );


    const input =
        document.getElementById(
            "roomCodeInput"
        );


    input.value =
        "";


    document
        .getElementById(
            "roomError"
        )
        .textContent =
        "";


    setTimeout(
        () =>
            input.focus(),
        50
    );

}


function closeRoomModal() {

    document
        .getElementById(
            "roomModal"
        )
        .classList
        .add(
            "hidden"
        );

}


// 방 코드 자동 대문자
document
    .getElementById(
        "roomCodeInput"
    )
    .addEventListener(
        "input",
        function() {

            this.value =
                this.value
                    .toUpperCase()
                    .replace(
                        /[^A-Z0-9]/g,
                        ""
                    );

        }
    );


document
    .getElementById(
        "roomCodeInput"
    )
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                joinCodeRoom();

            }

        }
    );


// =====================================================
// 방 코드 입장
// =====================================================

function joinCodeRoom() {

    const input =
        document.getElementById(
            "roomCodeInput"
        );


    const code =
        input.value
            .trim()
            .toUpperCase();


    const error =
        document.getElementById(
            "roomError"
        );


    error.textContent =
        "";


    if (!code) {

        error.textContent =
            "방 코드를 입력해주세요.";

        return;
    }


    socket.emit(
        "joinCodeRoom",
        code,
        response => {

            if (
                !response.success
            ) {

                error.textContent =
                    response.message;

                return;
            }


            closeRoomModal();


            currentMode =
                "codeRoom";


            currentTargetSize =
                null;


            showScreen(
                "waitingScreen"
            );


            document
                .getElementById(
                    "waitingTitle"
                )
                .textContent =
                "방 대기실";


            document
                .getElementById(
                    "waitingSubtitle"
                )
                .textContent =
                "4명 이상 모이면 누구나 게임을 시작할 수 있습니다.";


            const codeDisplay =
                document.getElementById(
                    "roomCodeDisplay"
                );


            codeDisplay.textContent =
                response.code;


            codeDisplay
                .classList
                .remove(
                    "hidden"
                );


            document
                .getElementById(
                    "startGameButton"
                )
                .classList
                .remove(
                    "hidden"
                );

        }
    );

}


// =====================================================
// 랜덤 매칭 팝업
// =====================================================

function openMatchModal() {

    document
        .getElementById(
            "matchModal"
        )
        .classList
        .remove(
            "hidden"
        );

}


function closeMatchModal() {

    document
        .getElementById(
            "matchModal"
        )
        .classList
        .add(
            "hidden"
        );

}


// =====================================================
// 랜덤 매칭
// =====================================================

function startMatchmaking(
    targetSize
) {

    closeMatchModal();


    socket.emit(
        "joinMatchmaking",
        targetSize,
        response => {

            if (
                !response.success
            ) {

                showToast(
                    response.message
                );

                return;
            }


            currentMode =
                "matchmaking";


            currentTargetSize =
                response.targetSize;


            currentRoom =
                null;


            showScreen(
                "waitingScreen"
            );


            document
                .getElementById(
                    "waitingTitle"
                )
                .textContent =
                `${currentTargetSize}인 랜덤 매칭`;


            document
                .getElementById(
                    "waitingSubtitle"
                )
                .textContent =
                "같은 인원수를 선택한 플레이어를 기다리고 있습니다.";


            document
                .getElementById(
                    "roomCodeDisplay"
                )
                .classList
                .add(
                    "hidden"
                );


            document
                .getElementById(
                    "startGameButton"
                )
                .classList
                .add(
                    "hidden"
                );

        }
    );

}


// =====================================================
// 매칭 대기 업데이트
// =====================================================

socket.on(
    "matchmakingUpdate",
    data => {

        if (
            currentMode !==
            "matchmaking"
        ) {

            return;
        }


        if (
            currentTargetSize !==
            data.targetSize
        ) {

            return;
        }


        document
            .getElementById(
                "bigCount"
            )
            .textContent =
            `${data.count} / ${data.targetSize}`;


        currentDisplayPlayers =
            data.players;


        renderWaitingPlayers(
            data.players
        );


        renderSidePlayerList();

    }
);


// =====================================================
// 랜덤 매칭 완료
// =====================================================

socket.on(
    "randomMatched",
    data => {

        currentMode =
            "matchedRoom";


        currentRoom =
            {
                id:
                    data.roomId,

                type:
                    "random",

                targetSize:
                    data.targetSize,

                players:
                    data.players
            };


        currentDisplayPlayers =
            data.players;


        showScreen(
            "waitingScreen"
        );


        document
            .getElementById(
                "waitingTitle"
            )
            .textContent =
            "🎉 매칭 완료!";


        document
            .getElementById(
                "waitingSubtitle"
            )
            .innerHTML =
            `
                ${data.targetSize}명이 모두 모였습니다.
                <br>
                다음 단계에서 게임 방식 투표가 시작됩니다.
            `;


        document
            .getElementById(
                "roomCodeDisplay"
            )
            .classList
            .add(
                "hidden"
            );


        document
            .getElementById(
                "bigCount"
            )
            .textContent =
            `${data.players.length} / ${data.targetSize}`;


        document
            .getElementById(
                "startGameButton"
            )
            .classList
            .add(
                "hidden"
            );


        renderWaitingPlayers(
            data.players
        );


        renderSidePlayerList();


        showToast(
            "랜덤 매칭 성공!"
        );

    }
);


// =====================================================
// 방 정보 업데이트
// =====================================================

socket.on(
    "roomUpdate",
    room => {

        currentRoom =
            room;


        currentDisplayPlayers =
            room.players;


        if (
            room.type ===
            "code"
        ) {

            currentMode =
                "codeRoom";


            document
                .getElementById(
                    "bigCount"
                )
                .textContent =
                `${room.count} / 8`;


            const startButton =
                document.getElementById(
                    "startGameButton"
                );


            startButton
                .classList
                .remove(
                    "hidden"
                );


            if (
                room.canStart
            ) {

                startButton
                    .classList
                    .add(
                        "active"
                    );


                startButton.disabled =
                    false;

            }

            else {

                startButton
                    .classList
                    .remove(
                        "active"
                    );


                startButton.disabled =
                    true;

            }

        }

        else {

            document
                .getElementById(
                    "bigCount"
                )
                .textContent =
                `${room.count} / ${room.targetSize}`;

        }


        renderWaitingPlayers(
            room.players
        );


        renderSidePlayerList();

    }
);


// =====================================================
// 대기방 참가자
// =====================================================

function renderWaitingPlayers(
    players
) {

    const grid =
        document.getElementById(
            "waitingPlayerGrid"
        );


    grid.innerHTML =
        "";


    players.forEach(
        player => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "waiting-player";


            if (
                player.nickname ===
                myNickname
            ) {

                div.classList.add(
                    "me"
                );


                div.textContent =
                    `★ ${player.nickname} (나)`;

            }

            else {

                div.textContent =
                    player.nickname;

            }


            grid.appendChild(
                div
            );

        }
    );

}


// =====================================================
// 게임 시작
// =====================================================

function requestGameStart() {

    const button =
        document.getElementById(
            "startGameButton"
        );


    if (
        button.disabled
    ) {

        return;
    }


    socket.emit(
        "requestGameStart",
        response => {

            if (
                !response.success
            ) {

                showToast(
                    response.message
                );

            }

        }
    );

}


socket.on(
    "gameStartPlaceholder",
    data => {

        showToast(
            data.message
        );


        showScreen(
            "nextStageScreen"
        );

    }
);


// =====================================================
// 나가기
// =====================================================

function leaveCurrentPlace() {

    if (
        currentMode ===
        "matchmaking"
    ) {

        socket.emit(
            "cancelMatchmaking",
            () => {

                goBackToLobby();

            }
        );

        return;
    }


    if (
        currentMode ===
        "codeRoom" ||
        currentMode ===
        "matchedRoom"
    ) {

        socket.emit(
            "leaveRoom",
            () => {

                goBackToLobby();

            }
        );

        return;
    }


    goBackToLobby();

}


function goBackToLobby() {

    currentMode =
        "lobby";

    currentRoom =
        null;

    currentTargetSize =
        null;

    currentDisplayPlayers =
        [];


    showScreen(
        "mainScreen"
    );


    renderSidePlayerList();

}


// =====================================================
// 온라인 플레이어
// =====================================================

socket.on(
    "onlinePlayerList",
    players => {

        onlinePlayers =
            players;


        renderSidePlayerList();

    }
);


// =====================================================
// 오른쪽 아래 플레이어 목록
// =====================================================

function renderSidePlayerList() {

    const list =
        document.getElementById(
            "playerList"
        );


    const title =
        document.getElementById(
            "playerListTitle"
        );


    list.innerHTML =
        "";


    let sourcePlayers;


    if (
        currentMode ===
        "lobby"
    ) {

        sourcePlayers =
            onlinePlayers;


        title.textContent =
            `👥 현재 접속자 ${sourcePlayers.length}명`;

    }

    else {

        sourcePlayers =
            currentDisplayPlayers;


        title.textContent =
            `👥 함께 플레이 ${sourcePlayers.length}명`;

    }


    sourcePlayers.forEach(
        player => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "player-row";


            if (
                player.nickname ===
                myNickname
            ) {

                row.classList.add(
                    "me"
                );


                row.textContent =
                    `★ ${player.nickname} (나)`;

            }

            else {

                row.textContent =
                    `• ${player.nickname}`;

            }


            list.appendChild(
                row
            );

        }
    );

}


// =====================================================
// 서버 연결 끊김
// =====================================================

socket.on(
    "disconnect",
    () => {

        showToast(
            "서버와의 연결이 끊어졌습니다."
        );

    }
);

</script>

</body>

</html>
