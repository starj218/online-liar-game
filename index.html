<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>온라인 라이어 게임</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background: #1d1d1d;

    color: white;

    font-family:
        Arial,
        "Malgun Gothic",
        sans-serif;

    overflow: hidden;
}


.screen {

    width: 100vw;
    height: 100vh;

    display: flex;

    align-items: center;
    justify-content: center;

    position: relative;
}

.hidden {
    display: none;
}


.shape {

    position: absolute;

    border-radius: 45% 55% 65% 35%;

    animation:
        float 5s ease-in-out infinite alternate;
}

.shape1 {

    width: 85px;
    height: 55px;

    background: #da97ed;

    top: 7%;
    left: 3%;
}

.shape2 {

    width: 55px;
    height: 55px;

    background: #ff7627;

    top: 9%;
    left: 45%;
}

.shape3 {

    width: 55px;
    height: 75px;

    background: #55d4df;

    top: 17%;
    right: 4%;
}

.shape4 {

    width: 55px;
    height: 120px;

    background: #12b864;

    left: 10%;
    bottom: 8%;

    transform: rotate(30deg);
}

.shape5 {

    width: 45px;
    height: 70px;

    background: #f44eb8;

    right: 24%;
    bottom: 10%;
}


@keyframes float {

    from {
        transform:
            translateY(0)
            rotate(-4deg);
    }

    to {
        transform:
            translateY(-12px)
            rotate(5deg);
    }

}


.nickname-card {

    width: min(90%, 430px);

    padding: 40px;

    background: #f4f4f4;

    border: 6px solid #cdbce8;

    border-radius: 40px;

    text-align: center;

    color: black;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.35);
}


.nickname-title {

    font-size: 42px;

    font-weight: 900;

    margin-bottom: 30px;
}


.nickname-input {

    width: 100%;

    padding: 16px;

    border-radius: 16px;

    border: 3px solid #222;

    font-size: 20px;

    text-align: center;

    outline: none;
}


.enter-button {

    width: 100%;

    margin-top: 18px;

    padding: 15px;

    border: none;

    border-radius: 16px;

    background: #5865f2;

    color: white;

    font-size: 20px;

    font-weight: bold;

    cursor: pointer;
}


.enter-button:hover {

    transform: scale(1.03);

}


.error {

    min-height: 25px;

    margin-top: 15px;

    color: #dc2626;

    font-weight: bold;
}


.main-content {

    text-align: center;

    position: relative;

    z-index: 2;
}


.logo {

    font-size: 58px;

    font-weight: 900;

    margin-bottom: 90px;

    letter-spacing: -3px;

    transform: rotate(-2deg);
}


.menu-button {

    display: block;

    width: 210px;

    margin: 12px auto;

    padding: 15px;

    border: none;

    border-radius: 22px;

    font-size: 23px;

    color: white;

    font-weight: bold;

    cursor: pointer;
}


.room-button {
    background: #5865f2;
}


.match-button {
    background: #12b864;
}


.menu-button:hover {
    transform: scale(1.06);
}


.player-list-box {

    position: fixed;

    right: 18px;
    bottom: 18px;

    width: 190px;

    max-height: 240px;

    overflow-y: auto;

    padding: 15px;

    background:
        rgba(0,0,0,0.65);

    border-radius: 16px;

    backdrop-filter: blur(8px);

    z-index: 50;
}


.player-list-title {

    font-weight: bold;

    margin-bottom: 10px;
}


.player-row {

    padding: 5px 0;

    color: #ddd;
}


.me {

    color: #67e8f9;

    font-weight: bold;
}

</style>

</head>


<body>


<section id="nicknameScreen"
         class="screen">

    <div class="nickname-card">

        <div class="nickname-title">
            &lt;닉네임&gt;
        </div>

        <input
            id="nicknameInput"
            class="nickname-input"
            maxlength="10"
            placeholder="닉네임을 입력하세요"
        >

        <button
            class="enter-button"
            onclick="enterGame()">

            입장

        </button>

        <div
            id="nicknameError"
            class="error">
        </div>

    </div>

</section>


<section id="mainScreen"
         class="screen hidden">

    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>
    <div class="shape shape4"></div>
    <div class="shape shape5"></div>

    <div class="main-content">

        <div class="logo">
            라이어 게임
        </div>

        <button
            class="menu-button room-button">

            방번호 입장

        </button>

        <button
            class="menu-button match-button">

            랜덤 매칭

        </button>

    </div>

</section>


<div
    id="playerListBox"
    class="player-list-box hidden">

    <div class="player-list-title">
        👥 현재 접속자
    </div>

    <div id="playerList"></div>

</div>


<script src="/socket.io/socket.io.js"></script>


<script>

const socket = io();

let myNickname = "";


// ========================================
// 닉네임 입장
// ========================================

function enterGame() {

    const input =
        document.getElementById(
            "nicknameInput"
        );

    const nickname =
        input.value.trim();

    const error =
        document.getElementById(
            "nicknameError"
        );

    error.textContent = "";


    socket.emit(

        "joinWithNickname",

        nickname,

        function(response) {

            if (!response.success) {

                error.textContent =
                    response.message;

                return;
            }


            myNickname =
                response.nickname;


            document
                .getElementById(
                    "nicknameScreen"
                )
                .classList.add(
                    "hidden"
                );


            document
                .getElementById(
                    "mainScreen"
                )
                .classList.remove(
                    "hidden"
                );


            document
                .getElementById(
                    "playerListBox"
                )
                .classList.remove(
                    "hidden"
                );

        }

    );

}


// ========================================
// Enter 키로 입장
// ========================================

document
    .getElementById(
        "nicknameInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                enterGame();

            }

        }
    );


// ========================================
// 플레이어 목록
// ========================================

socket.on(
    "playerList",
    function(players) {

        const list =
            document.getElementById(
                "playerList"
            );

        list.innerHTML = "";


        players.forEach(
            player => {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "player-row";


                if (
                    player.nickname ===
                    myNickname
                ) {

                    row.classList.add(
                        "me"
                    );

                    row.textContent =
                        "★ " +
                        player.nickname +
                        " (나)";

                }

                else {

                    row.textContent =
                        "• " +
                        player.nickname;

                }


                list.appendChild(
                    row
                );

            }
        );

    }
);

</script>


</body>
</html>
